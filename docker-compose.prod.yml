x-backend-build: &backend-build
  context: ./backend
  dockerfile: ../docker/Dockerfile.backend.prod

x-postgres-build: &postgres-build
  context: .
  dockerfile: docker/Dockerfile.postgres.prod

x-database-environment: &database-environment
  APP_ENV: production
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

services:
  db:
    build: *postgres-build
    environment:
      POSTGRES_USER: vela
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_DB: vela
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vela -d vela"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build: *backend-build
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *database-environment
      VELA_ENTRYPOINT_MODE: migrate
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backend:
    build: *backend-build
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *database-environment
      DEBUG: "false"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      ALGORITHM: HS256
      DEPLOYMENT_MODE: single_tenant
      INSTANCE_ORGANIZATION: ${INSTANCE_ORGANIZATION:?set INSTANCE_ORGANIZATION to the only pilot organisation}
      CHROMA_PERSIST_DIR: /app/data/chroma
      CORPUS_AGENT_ENABLED: "false"
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost}
      PUBLIC_API_URL: ${PUBLIC_URL:-http://localhost}/api/v1
      ALLOW_OPEN_REGISTRATION: ${ALLOW_OPEN_REGISTRATION:-false}
      ALLOW_PASSWORD_LOGIN: ${ALLOW_PASSWORD_LOGIN:-true}
      RATE_LIMIT_ENABLED: "true"
      SSO_ENABLED: ${SSO_ENABLED:-false}
      SSO_PROVIDER_NAME: ${SSO_PROVIDER_NAME:-企业 SSO}
      SSO_ISSUER_URL: ${SSO_ISSUER_URL:-}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-}
      SSO_DEFAULT_ROLE: ${SSO_DEFAULT_ROLE:-business}
      EXPORT_TEMPLATE: ${EXPORT_TEMPLATE:-law_school}
      EXPORT_ORG_NAME: ${EXPORT_ORG_NAME:-Vela 出海法务台}
      EXPORT_ORG_DEPARTMENT: ${EXPORT_ORG_DEPARTMENT:-企业法务部}
      EXPORT_RECIPIENT_LABEL: ${EXPORT_RECIPIENT_LABEL:-企业管理层}
      LLM_POLISH_ENABLED: "false"
    volumes:
      - backend_data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; connection = http.client.HTTPConnection('127.0.0.1', 8000, timeout=4); connection.request('GET', '/api/v1/health'); raise SystemExit(0 if connection.getresponse().status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend.prod
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      # Nginx buffers request bodies in /tmp. This must stay above the
      # application batch-upload ceiling (100 MiB) plus proxy overhead.
      - /tmp:rw,noexec,nosuid,size=192m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  backend_data:
